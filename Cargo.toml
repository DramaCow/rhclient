[package]
name = "rhclient"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.28.2", features = ["abi3-py311"] }
rathole = { version = "=0.5.0", default-features = false, features = ["client", "noise"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tempfile = "3"
serde_json = "1"
toml = "0.5"
base64 = "0.23"
